<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GraphMeshUNet 3D Viewer</title>
<style>body{margin:0;background:#111b29;color:#eef3fa;font:16px system-ui}main{max-width:1100px;margin:auto;padding:24px}#viewport{height:65vh;min-height:350px;background:#202e42;border-radius:16px;overflow:hidden}canvas{display:block;touch-action:none}button,input{margin:8px;padding:10px}img{max-width:100%;max-height:300px}p{color:#c0ccdd}</style>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js","three/addons/":"./vendor/"}}</script>
<main><h1>GraphMeshUNet · 3D Geometry Viewer</h1><p>Drag to rotate · Scroll or pinch to zoom · Right-drag to pan</p><label>Load STL <input id="file" type="file" accept=".stl"></label><button id="reset">Reset view</button><button id="spin">Auto-rotate</button><p id="status" role="status">Loading viewer…</p><div id="viewport"></div><details open id="preview"><summary>Animation preview</summary><img src="assets/Titlelist_PROV1.gif" alt="Golf ball animation"><p>The animation is a preview. Interactive viewing requires its corresponding STL geometry.</p></details></main>
<script type="module">
const status=document.querySelector('#status');
try {
const THREE=await import('three');const {OrbitControls}=await import('three/addons/controls/OrbitControls.js');const {STLLoader}=await import('three/addons/loaders/STLLoader.js');
const host=document.querySelector('#viewport'),scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(40,1,.01,100),renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));host.append(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.minDistance=.3;controls.maxDistance=15;
scene.add(new THREE.HemisphereLight(0xffffff,0x445566,2));const light=new THREE.DirectionalLight(0xffffff,3);light.position.set(3,4,5);scene.add(light);
let mesh;const loader=new STLLoader();function reset(){camera.position.set(0,0,3.4);controls.target.set(0,0,0);controls.update();}reset();
function show(geometry,name){const pos=geometry.getAttribute('position');if(!pos||pos.count<3||pos.array.some(x=>!Number.isFinite(x)))throw Error('Invalid vertices');geometry.computeBoundingBox();const size=geometry.boundingBox.getSize(new THREE.Vector3()),scale=Math.max(size.x,size.y,size.z);if(!(scale>0))throw Error('Empty geometry');geometry.center();geometry.scale(2/scale,2/scale,2/scale);geometry.computeVertexNormals();if(mesh){scene.remove(mesh);mesh.geometry.dispose();mesh.material.dispose();}mesh=new THREE.Mesh(geometry,new THREE.MeshStandardMaterial({color:0xf0f1ee,roughness:.5,side:THREE.DoubleSide}));scene.add(mesh);reset();status.textContent='Viewing '+name;document.querySelector('#preview').open=false;}
document.querySelector('#file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{show(loader.parse(await f.arrayBuffer()),f.name);}catch(err){status.textContent='Unable to load STL: '+err.message;}};
document.querySelector('#reset').onclick=reset;document.querySelector('#spin').onclick=e=>{controls.autoRotate=!controls.autoRotate;e.target.textContent=controls.autoRotate?'Stop rotation':'Auto-rotate';};
new ResizeObserver(()=>{renderer.setSize(host.clientWidth,host.clientHeight);camera.aspect=host.clientWidth/host.clientHeight;camera.updateProjectionMatrix();}).observe(host);
renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera);});
status.textContent='Downloading default model…';try{const response=await fetch('assets/golf_ball.binary.stl');if(!response.ok)throw Error('HTTP '+response.status+' while downloading model');show(loader.parse(await response.arrayBuffer()),'golf_ball.stl');}catch(err){status.textContent='Default model could not load: '+err.message+'. You can also select a local STL.';}
}catch(err){status.textContent='Viewer unavailable. Check internet access and WebGL support. '+err.message;}
</script></html>
